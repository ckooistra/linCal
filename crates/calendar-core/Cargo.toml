[package]
name = "calendar-core"
version = "0.1.0"
description = "Provider-neutral calendar models, validation and recurrence expansion"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["std", "clock", "serde"] }
chrono-tz = "0.10"
rrule = "0.14"
serde = { version = "1", features = ["derive"] }
thiserror = "2"

[features]
# Deterministic simulated dataset generator (development and benchmarks).
sim = []

[dev-dependencies]
serde_json = "1"
