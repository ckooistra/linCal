[package]
name = "calendar-google"
version = "0.1.0"
description = "Google Calendar API v3 provider"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
calendar-core = { path = "../calendar-core" }
calendar-ical = { path = "../calendar-ical" }
calendar-oauth = { path = "../calendar-oauth" }
calendar-provider-api = { path = "../calendar-provider-api" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

# Optional: wiremock is only pulled in by the `testing` feature.
wiremock = { version = "0.6", optional = true }

[features]
# A stateful fake of the Calendar API for tests in this and other crates.
testing = ["dep:wiremock"]

[dev-dependencies]
calendar-google = { path = ".", features = ["testing"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
