[package]
name = "calendar-ics"
version = "0.1.0"
description = "Read-only iCalendar feed (ICS subscription) provider"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
calendar-caldav = { path = "../calendar-caldav" }
calendar-ical = { path = "../calendar-ical" }
calendar-provider-api = { path = "../calendar-provider-api" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2", "gzip"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
