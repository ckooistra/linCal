[package]
name = "calendar-caldav"
version = "0.1.0"
description = "CalDAV (RFC 4791 / 6578) provider for the calendar engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
async-trait = "0.1"
calendar-provider-api = { path = "../calendar-provider-api" }
reqwest = { version = "0.13", default-features = false, features = ["rustls", "charset", "http2"] }
roxmltree = "0.21"
url = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6"
