[package]
name = "calendar-storage"
version = "0.1.0"
description = "SQLite persistence and range queries for the calendar engine"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[dependencies]
calendar-core = { path = "../calendar-core" }
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
chrono-tz = "0.10"
serde_json = "1"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite-bundled", "migrate", "macros"] }
thiserror = "2"
tokio = { version = "1", features = ["rt"] }

[dev-dependencies]
calendar-core = { path = "../calendar-core", features = ["sim"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
