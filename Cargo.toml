[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/calendar-core", "crates/calendar-storage", "crates/calendar-ical", "crates/calendar-provider-api", "crates/calendar-caldav", "crates/calendar-oauth", "crates/calendar-google", "crates/calendar-microsoft", "crates/calendar-ics", "crates/calendar-sync"]

[workspace.package]
edition = "2024"
license = "GPL-3.0-or-later"
rust-version = "1.94"  # SQLx 0.9 requires 1.94

[profile.release]
strip = true
