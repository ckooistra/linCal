[package]
name = "universal-calendar-desktop"
version = "0.1.0"
description = "Universal Calendar desktop shell (thin Tauri integration layer)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "universal_calendar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
calendar-core = { path = "../../../crates/calendar-core", features = ["sim"] }
calendar-storage = { path = "../../../crates/calendar-storage" }
calendar-sync = { path = "../../../crates/calendar-sync", features = ["keyring"] }
calendar-provider-api = { path = "../../../crates/calendar-provider-api" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
# Opens the system browser for OAuth sign-in (called from Rust only).
tauri-plugin-opener = "2"
