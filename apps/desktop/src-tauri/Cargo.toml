[package]
name = "universal-calendar-desktop"
version = "0.1.0"
description = "Universal Calendar desktop shell (thin Tauri integration layer)"
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false

[lib]
name = "universal_calendar_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
